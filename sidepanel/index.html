<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Taboom - Tabs Manager</title>
  <link rel="stylesheet" href="../styles/common.css" />
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header>
    <div class="titlebar">
      <h1>Taboom - Tabs Manager</h1>
      <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
    <button id="update-banner" hidden></button>
    <div class="search-row">
      <button id="hist-back" class="icon-btn" title="Previous tab" aria-label="Previous tab" disabled><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg></button>
      <button id="hist-forward" class="icon-btn" title="Next tab" aria-label="Next tab" disabled><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 3 5 5-5 5"/></svg></button>
      <!-- caret-over-list: caret flips up while the popover is open (JS toggles .open) -->
      <button id="hist-list-btn" class="icon-btn" popovertarget="history-pop" title="Show Navigation History" aria-label="Show Navigation History" hidden><svg class="caret-closed" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4.6 3.4 3.4 3 3.4-3"/><path d="M4 9.4h8M4 12.4h8"/></svg><svg class="caret-open" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4.6 6.4 3.4-3 3.4 3"/><path d="M4 9.4h8M4 12.4h8"/></svg></button>
      <input id="search" type="search" placeholder="Search tabs…  ( / )" autofocus />
    </div>
    <div id="history-pop" popover></div>
    <div id="filters" class="segmented" role="tablist" aria-label="Filter tabs">
      <button data-filter="all" aria-pressed="true">All <span class="count"></span></button>
      <button data-filter="awake" aria-pressed="false">Awake <span class="count"></span></button>
      <button data-filter="snoozed" aria-pressed="false">Snoozed <span class="count"></span></button>
      <button data-filter="protected" aria-pressed="false">Protected <span class="count"></span></button>
    </div>
    <div class="toolbar">
      <label class="select-all"><input type="checkbox" id="select-all" aria-label="Select all visible tabs" /></label>
      <select id="scope" aria-label="Window scope">
        <option value="all-windows">All windows</option>
        <option value="current-window">Current window</option>
      </select>
      <select id="sort" aria-label="Sort order">
        <option value="recent">Recently used</option>
        <option value="oldest">Least recently used</option>
        <option value="title">Title</option>
        <option value="domain">Domain</option>
        <option value="window">Group by window</option>
      </select>
      <button id="collapse-all" class="icon-btn" hidden></button>
    </div>
  </header>

  <main id="tab-list" role="listbox" aria-label="Open tabs"></main>

  <!-- Row skeleton, cloned per tab (parsing SVG via innerHTML per row is slow).
       Both protect variants ship here; renderRow removes the one not needed.
       Unicode glyphs (⏸ 🛡 ✕) would render at wildly different sizes/baselines per platform. -->
  <template id="row-template">
    <div class="row" role="option">
      <input type="checkbox" aria-label="Select tab" />
      <span class="win-dot"></span>
      <span class="favicon"></span>
      <div class="main">
        <div class="title"></div>
        <div class="meta"><span class="host"></span></div>
      </div>
      <div class="actions">
        <button data-action="snooze" title="Snooze" aria-label="Snooze"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 3v10M10 3v10"/></svg></button>
        <button data-action="toggle-protect" data-icon="protect"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M8 1.8 13.2 3.7V8c0 3.2-2.3 5.1-5.2 6.2C5.1 13.1 2.8 11.2 2.8 8V3.7Z"/></svg></button>
        <button data-action="toggle-protect" data-icon="unprotect"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M8 1.8 13.2 3.7V8c0 3.2-2.3 5.1-5.2 6.2C5.1 13.1 2.8 11.2 2.8 8V3.7Z"/><path stroke-linecap="round" d="M3 2.5l10 11"/></svg></button>
        <button data-action="close" title="Close" aria-label="Close"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
      </div>
    </div>
  </template>

  <div id="toast" role="status" hidden></div>

  <footer id="bulk-bar">
    <span id="bulk-count"></span>
    <button id="bulk-snooze">Snooze</button>
    <button id="bulk-wake">Wake</button>
    <button id="bulk-protect">Protect</button>
    <button id="bulk-close">Close</button>
    <button id="bulk-clear" class="icon-btn" title="Clear selection" aria-label="Clear selection"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
  </footer>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
